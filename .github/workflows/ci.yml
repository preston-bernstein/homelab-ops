name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  ci:
    uses: preston-bernstein/ci-workflows/.github/workflows/shell.yml@v1
    with:
      # skills/incident-triage opens PRs into this repo unattended, so every PR
      # -- including a future bot-generated incident report -- must pass this.
      checks: |
        bash tests/test_no_host_identifiers.sh

  workflows:
    uses: preston-bernstein/ci-workflows/.github/workflows/actions-lint.yml@v1
